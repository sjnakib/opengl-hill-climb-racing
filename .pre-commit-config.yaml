# Local mirror of the CI gates. CI is the source of truth.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b   # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 45ef068da5f21267bb2a7ec4a623092959f09ce5   # v0.14.14 (CI pins 0.17.2+)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Branch verification guards (SPECS §7). Wrong-branch commits and pushes
  # are refused locally, so a stale ref can never overwrite remote main.
  - repo: local
    hooks:
      - id: branch-guard
        name: branch guard (SPECS §7)
        entry: uv run --no-sync python scripts/branch_guard.py verify-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lane-guard
        name: lane guard (SPECS §7)
        entry: uv run --no-sync python scripts/branch_guard.py verify-lane
        language: system
        stages: [commit-msg]
      - id: push-guard
        name: push guard (SPECS §7)
        entry: uv run --no-sync python scripts/branch_guard.py verify-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
