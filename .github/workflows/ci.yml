name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: mypy (strict; skips cleanly until sources exist)
        run: |
          if [ -d src/hillclimb ]; then
            uv run --no-sync mypy src tests
          else
            echo "no sources yet — mypy skipped until the game scaffolding lands"
          fi

  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: engine purity (no pygame / network imports in engine/)
        run: |
          if [ -d src/hillclimb/engine ]; then
            ! grep -R -nE '^\s*(import|from)\s+(pygame|numpy|socket|http|urllib|requests)' src/hillclimb/engine/
          fi
      - name: repository network ban (SPECS §2)
        run: |
          if [ -d src ]; then
            ! grep -R -nE '^\s*(import|from)\s+(socket|http|urllib|requests|ftplib|telnetlib)' src/ \
              --include='*.py'
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: tests + coverage
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          if [ -d tests ]; then
            uv run --no-sync coverage run -m pytest
            uv run --no-sync coverage report
          else
            echo "no tests yet — skipped until the first module lands"
          fi

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync pip-audit
