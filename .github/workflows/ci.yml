name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  prose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: writing standard (SPECS §19)
        run: >
          uv run --no-sync vale README.md CHANGELOG.md CONTRIBUTING.md
          SECURITY.md SPECS.md .github/PULL_REQUEST_TEMPLATE.md

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: mypy (strict)
        run: uv run --no-sync mypy src tests

  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: engine purity (no pygame / network imports in engine/)
        run: |
          if [ -d src/hillclimb/engine ]; then
            ! grep -R -nE '^\s*(import|from)\s+(pygame|numpy|socket|http|urllib|requests)' src/hillclimb/engine/
          fi
      - name: engine numeric law (no libm transcendentals, SPECS §10.2)
        run: |
          if [ -d src/hillclimb/engine ]; then
            ! grep -R -nE '\b(math|cmath)\s*\.\s*(sin|cos|tan|atan2|exp|log|log10|log2|pow|hypot)\b' \
              src/hillclimb/engine --include='*.py'
            ! grep -R -nE '^\s*from\s+(math|cmath)\s+import\s+.*\b(sin|cos|tan|atan2|exp|log|log10|log2|pow|hypot)\b' \
              src/hillclimb/engine --include='*.py'
            ! grep -R -nE '^\s*import\s+cmath\b' src/hillclimb/engine --include='*.py'
          fi
      - name: repository network ban (SPECS §2)
        run: |
          if [ -d src ]; then
            ! grep -R -nE '^\s*(import|from)\s+(socket|http|urllib|requests|ftplib|telnetlib)' src/ \
              --include='*.py'
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: tests + coverage
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          uv run --no-sync coverage run -m pytest
          uv run --no-sync coverage report
      - name: engine coverage floor (SPECS §12)
        run: |
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync python scripts/coverage_gate.py coverage.json

  determinism:
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: R1 replay determinism (SPECS §12)
        run: uv run --no-sync pytest tests/property/test_r1_determinism.py -q

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync pip-audit
